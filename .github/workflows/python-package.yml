name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evaluation/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[torch,cpp,test]"
      - name: Python backend tests
        run: python -X utf8 -m pytest tests -q
      - name: Build native backend
        run: python setup_cpp.py build_ext --inplace
      - name: Native integration tests
        run: python -X utf8 -m pytest tests/agents tests/games/test_a3_v12_native.py -q
      - name: Native parity
        run: python -X utf8 test_parity.py
