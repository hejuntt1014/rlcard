<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A3 训练评估</title><style>body{font:16px system-ui;background:#101827;color:#e5edf8;max-width:1050px;margin:40px auto;padding:0 20px}h1{font-size:28px}section{background:#192439;border-radius:12px;padding:20px;margin:18px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #334155}.muted{color:#9babbe}svg{width:100%;height:220px}pre{white-space:pre-wrap}</style>
<h1>A3 训练评估</h1><p class="muted">强化学习模型与 rule_ultra · 标准规则 · 固定种子混战</p>
<section><div id="status">读取状态…</div><p id="detail" class="muted"></p></section>
<section><h2>模型表现 <select id="metric" onchange="refresh()"><option value="avgScore">平均得分</option><option value="winRate">胜率</option></select></h2><svg viewBox="0 0 900 220"><path d="M65 10V190H880" fill="none" stroke="#526580"/><text id="high" x="0" y="20" fill="#9babbe"/><text id="low" x="0" y="190" fill="#9babbe"/><polyline id="curve" fill="none" stroke="#5bd9b2" stroke-width="3"/><circle id="latest" r="4" fill="#5bd9b2"/></svg><p class="muted">横轴：训练帧数。混战胜率按引擎控制的玩家统计，需结合得分、报牌表现一起判断。</p></section>
<section style="overflow:auto"><table><thead><tr><th>时间</th><th>训练帧数</th><th>模型得分</th><th>模型胜率</th><th>对手胜率</th><th>模型报牌次数 / 胜率</th><th>评估耗时</th><th>有效性</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>
const labels={exporting:'读取模型',evaluating:'正在评估',idle:'等待下一次检查',waiting_checkpoint:'等待训练检查点',error:'评估错误',invalid_evaluation:'评估存在异常',stopped:'已停止'};
async function refresh(){try{const [s,h]=await Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/metrics').then(r=>r.json())]);
document.getElementById('status').textContent=labels[s.state]||s.state||'等待启动';document.getElementById('detail').textContent=s.error||`${s.games||0} 局 · ${s.workers||0} 个评估进程 · 每进程 ${s.onnx_threads||0} 个推理线程 · ${s.interval_minutes||0} 分钟间隔`;
const rows=Array.isArray(h)?h:[];document.getElementById('rows').replaceChildren(...rows.slice(-30).reverse().map(x=>{const tr=document.createElement('tr');const e=x.evaluation,r=e.engines.rule_rl;for(const v of [new Date(x.timestamp).toLocaleString(),Number(x.model.frames).toLocaleString(),r.avgScore.toFixed(2),(r.winRate*100).toFixed(2)+'%',(e.engines.rule_ultra.winRate*100).toFixed(2)+'%',r.declareCount+' / '+(r.declareWinRate*100).toFixed(1)+'%',e.wallSeconds.toFixed(1)+' 秒',e.valid?'有效':'有异常']){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}));
const valid=rows.filter(x=>x.evaluation.valid),max=Math.max(1,...valid.map(x=>x.model.frames)),metric=document.getElementById('metric').value;
const values=valid.map(x=>x.evaluation.engines.rule_rl[metric]*(metric==='winRate'?100:1)),low=metric==='winRate'?0:Math.min(0,...values),high=metric==='winRate'?100:Math.max(low+1,...values,0),points=valid.map((x,i)=>[65+x.model.frames/max*810,190-(values[i]-low)/(high-low)*180]);
document.getElementById('high').textContent=high.toFixed(1);document.getElementById('low').textContent=low.toFixed(1);document.getElementById('curve').setAttribute('points',points.map(p=>p.join(',')).join(' '));const dot=document.getElementById('latest');dot.style.display=points.length?'':'none';if(points.length){dot.setAttribute('cx',points.at(-1)[0]);dot.setAttribute('cy',points.at(-1)[1])}}catch(e){document.getElementById('status').textContent='暂时无法读取状态'}}refresh();setInterval(refresh,5000);
</script></html>
