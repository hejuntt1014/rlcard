<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A3 训练评估</title><style>body{font:16px system-ui;background:#101827;color:#e5edf8;max-width:1050px;margin:40px auto;padding:0 20px}h1{font-size:28px}section{background:#192439;border-radius:12px;padding:20px;margin:18px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #334155}.muted{color:#9babbe}svg{width:100%;height:220px}pre{white-space:pre-wrap}</style>
<h1>A3 训练评估</h1><p class="muted">强化学习模型与 rule_ultra 固定种子混战</p>
<section><div id="status">读取状态…</div><p id="detail" class="muted"></p></section>
<section><h2>模型胜率</h2><svg viewBox="0 0 900 220"><path d="M30 10V190H880" fill="none" stroke="#526580"/><polyline id="curve" fill="none" stroke="#5bd9b2" stroke-width="3"/></svg><p class="muted">横轴：训练帧数；纵轴：胜率（0–100%）</p></section>
<section><table><thead><tr><th>时间</th><th>训练帧数</th><th>模型胜率</th><th>对手胜率</th><th>评估耗时</th><th>有效性</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>
const labels={exporting:'读取模型',evaluating:'正在评估',idle:'等待下一次检查',waiting_checkpoint:'等待训练检查点',error:'评估错误',invalid_evaluation:'评估存在异常',stopped:'已停止'};
async function refresh(){try{const [s,h]=await Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/metrics').then(r=>r.json())]);
document.getElementById('status').textContent=labels[s.state]||s.state||'等待启动';document.getElementById('detail').textContent=s.error||`${s.games||0} 局 · ${s.workers||0} 个评估进程 · 每进程 ${s.onnx_threads||0} 个推理线程 · ${s.interval_minutes||0} 分钟间隔`;
const rows=Array.isArray(h)?h:[];document.getElementById('rows').replaceChildren(...rows.slice(-30).reverse().map(x=>{const tr=document.createElement('tr');const e=x.evaluation;for(const v of [new Date(x.timestamp).toLocaleString(),Number(x.model.frames).toLocaleString(),(e.engines.rule_rl.winRate*100).toFixed(2)+'%',(e.engines.rule_ultra.winRate*100).toFixed(2)+'%',e.wallSeconds.toFixed(1)+' 秒',e.valid?'有效':'有异常']){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}));
const valid=rows.filter(x=>x.evaluation.valid),max=Math.max(1,...valid.map(x=>x.model.frames));document.getElementById('curve').setAttribute('points',valid.map(x=>`${30+x.model.frames/max*850},${190-x.evaluation.engines.rule_rl.winRate*180}`).join(' '));}catch(e){document.getElementById('status').textContent='暂时无法读取状态'}}refresh();setInterval(refresh,5000);
</script></html>
